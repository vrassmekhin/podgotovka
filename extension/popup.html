<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      body {
        width: 280px; margin: 0; padding: 14px 16px;
        font: 13.5px/1.5 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
        background: #fff; color: #1f2330;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1b1d27; color: #e7e9f2; }
        ol { color: #c7cbdb; }
        .badge.no { background: #3a2326; color: #fca5a5; }
      }
      h1 { font-size: 15px; margin: 0 0 8px; }
      ol { margin: 6px 0 12px; padding-left: 18px; }
      li { margin: 3px 0; }
      .badge {
        display: inline-block; padding: 3px 8px; border-radius: 999px;
        font-size: 12px; font-weight: 600; margin-bottom: 10px;
      }
      .badge.ok { background: #dcfce7; color: #166534; }
      .badge.no { background: #fee2e2; color: #b91c1c; }
      button {
        width: 100%; padding: 9px; border: none; border-radius: 9px;
        background: #4f46e5; color: #fff; font: 600 13.5px/1 inherit; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>🎓 Разбор вопросов</h1>
    <div id="badge" class="badge no">Ключ не задан</div>
    <ol>
      <li>Выделите на странице вопрос с вариантами ответа.</li>
      <li>Нажмите кнопку <b>«🎓 Разобрать вопрос»</b> или пункт правого клика.</li>
      <li>В панели появится разбор каждого варианта.</li>
    </ol>
    <button id="opt">Настройки и API-ключ</button>
    <script src="popup.js"></script>
  </body>
</html>
